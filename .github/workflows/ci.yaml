name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The engine packages carry the parser, the evaluator and the optimizer, and
  # none of them may depend on Flutter. This job installs the Dart SDK and
  # nothing else, so that claim is enforced by the environment rather than by
  # a lint: if any of them grew a Flutter dependency, `dart pub get` here would
  # simply fail.
  #
  # Deliberately does not use melos. `melos bootstrap` walks every package in
  # the workspace, including app/, and would need Flutter installed — which
  # would quietly destroy the very property this job is checking.
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # Everything resolves first. `dart format` picks its style from the
      # enclosing package's language version, which it can only read once
      # package_config.json exists — and the style genuinely differs, because
      # Dart 3.7 changed the formatter. Format before resolving and every file
      # gets reformatted against the wrong rules.
      - name: Resolve
        run: |
          dart pub get
          dart pub get --directory packages/rewards_engine
          dart pub get --directory packages/statement_parser
          dart pub get --directory packages/pdf_glyph_source

      # app/ is formatted in its own job, where Flutter can resolve it.
      - name: Format
        run: dart format --output=none --set-exit-if-changed packages tools

      - name: Purity check (no Flutter in the engine packages)
        run: dart run tools/check_purity.dart

      - name: Analyze tooling
        run: dart analyze --fatal-infos tools

      - name: rewards_engine
        working-directory: packages/rewards_engine
        run: |
          dart analyze --fatal-infos .
          dart test

      - name: statement_parser
        working-directory: packages/statement_parser
        run: |
          dart analyze --fatal-infos .
          dart test

      - name: pdf_glyph_source
        working-directory: packages/pdf_glyph_source
        run: |
          dart analyze --fatal-infos .
          dart test

  # The Flutter half. Separate so a failure here cannot be mistaken for a
  # failure of the engine packages, and vice versa.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve
        working-directory: app
        run: flutter pub get

      - name: Format
        working-directory: app
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test
